[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "outlook-assistant-plugin"
version = "2.19.1"
description = "Local Outlook mail, tasks, projects, and IBM Bob assistance for Mac."
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Developer" }
]
dependencies = []

[project.scripts]
outlook-assistant = "outlook_plugin.cli:main"

[tool.setuptools.packages.find]
include = ["outlook_plugin*"]

[tool.setuptools.package-data]
outlook_plugin = ["static/*", "bin/*"]
